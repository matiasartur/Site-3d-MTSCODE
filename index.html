<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site 3D</title>
    <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
     <img class="image-gradient" src="gradient.png" alt="gradient">
     <div class="layer-blur"></div>

     <div class="container">
        <header>
             <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">MTSCODE</h1>

             <nav>
                <a data-aos="fade-down" data-aos-duration="1500" href="#">EMPRESA</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="#">FEATURES</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="#">RECURSOS</a>
                <a data-aos="fade-down" data-aos-duration="3000" href="#">DOCS</a>
             </nav>

             <button data-aos="fade-down" data-aos-duration="1500" class="btn-signing">LOGIN</button>
        </header>

        <main>
            <div class="content">
                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="1500" class="tag-box">
                    <div class="tag">INTRODUZINDO &wedbar;</div>
                </div> 

                <h1 data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2000" >EMAIL PARA<br>DESENVOLVEDORES</h1>

                <p data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2500"  class="description">a melhor maneira de alcançar pessoas interessadas em evitar pastas de spam, e-mails transacionais e de marketing em grande escala</p>

                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="3000"  class="buttons">
                    <a href="#" class="btn-get-started">Documentos &gt;</a>
                    <a href="" class="btn-signing-main">Comece agora &gt;</a>
                </div>
            </div>
        </main>

        <spline-viewer data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="3000" class="robot-3d" url="https://prod.spline.design/MZ5lCcnB9cdbh-S3/scene.splinecode"></spline-viewer>

     </div>

     <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.68/build/spline-viewer.js"></script>

       <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
    
</body>
</html>
